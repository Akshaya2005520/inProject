    <link rel="stylesheet" href="assests/css/style.css"> <!-- Link to your main stylesheet -->
    <style>
        body {
            background-image: url("assests/images/123.jpg"); /* Ensure this path is correct */
            background-size: 1500px;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; /* This makes the background stay in place */
            font-family: 'Open Sans', sans-serif; /* Ensure consistent font */
            margin: 0;
            display: flex; /* Make body a flex container */
            flex-direction: column; /* Stack children vertically */
            min-height: 100vh; /* Ensure body takes full viewport height */
        }

        .container {
            background-color: rgba(255, 255, 255, 0.8); /* Slight transparency for readability */
            padding: 40px;
            border-radius: 40px;
             border: 1px solid #6d5b5b;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.856);
           /* Standard shadow */
            width: 500px; /* Adjusted width for better centering */
            max-width: 60%; /* Ensure it doesn't overflow on smaller screens */
        }
     .container:hover{
        transform: translateY(-8px);
     }
        h1 {
            text-align: center;
            color: var(--color1); /* Use a color from your stylesheet */
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn-primary {
            background-color: var(--color2); /* Use a color from your stylesheet */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            width: 100%;
            font-size: 16px;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        #cityDropdown {
            display: none;
            position: absolute;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        #cityDropdown a {
            display: block;
            padding: 5px;
            text-decoration: none;
            color: #333;
        }

        #cityDropdown a:hover {
            background-color: #f0f0f0;
        }

        /* New style for the main content wrapper */
        .main-content-wrapper {
            flex-grow: 1; /* Allows this wrapper to take up all available vertical space */
            display: flex; /* Make it a flex container to center its child (.container) */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            padding: 20px; /* Add some padding around the form */
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <!--sidebar-->
       
            <!--logo-->
          <div class="logo">
    
         
                <img src="assests/images/LOGO.png"alt="Logo">
            </div>
            <!--title-->

           

            <!--menus-->
            <div class="sidebar-menus">
                <a href="index.html"><ion-icon name="storefront-outline"></ion-icon>HOME</a>
                <a href="loc.html"><ion-icon name="location-outline"></ion-icon>LOCATION</a>
                <a href="offer.html"><ion-icon name="sparkles-outline"></ion-icon>TODAY OFFERS</a>
                <a href="contact-us.html"><ion-icon name="chatbubbles-outline"></ion-icon>CONTACT-US</a>
                <a href="help.html"><ion-icon name="help-circle-outline"></ion-icon>HELP</a>
            </div>
       
         <div class="profile">
                <a class="cart" href="cart.html"><ion-icon name="cart-outline"></ion-icon></a>
                <a class="user" href="login1.html"><ion-icon name="person-outline"></ion-icon></a>
            </div>
    </div>
    <div class="main-content-wrapper">
        <div class="container">
            <h1>Enter Your Delivery Details</h1>

            <div class="input-group">
                <label for="location">Enter Perfect Location:</label>
                <input type="text" id="location" name="location" placeholder="Your Address or Area" required>
            </div>

            <div class="input-group">
                <label for="city">Select City:</label>
                <select id="city" name="city" required>
                    <option value="">Select a City</option>
                    <option value="New York">New York</option>
                    <option value="Los Angeles">Los Angeles</option>
                    <option value="Chicago">Chicago</option>
                    <option value="Houston">Houston</option>
                    <option value="Madurai">Madurai</option>
                    <option value="Dindigul">Dindigul</option>
                    <option value="Kanchipuram">Kanchipuram</option>
                    <option value="Dallas">Dallas</option>
                    <option value="Philadelphia">Philadelphia</option>
                    <option value="Phoenix">Phoenix</option>
                    <option value="San Antonio">San Antonio</option>
                    <option value="San Diego">San Diego</option>
                </select>
            </div>

            <div class="input-group">
                <label for="deliveryTime">Select Delivery Time:</label>
                <input type="time" id="deliveryTime" name="deliveryTime" required>
            </div>

            <div class="input-group">
                <label for="amPm">AM/PM:</label>
                <select id="amPm" name="amPm" required>
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                </select>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Submit</button>
        </div>
    </div>
 <!-- Footer Section -->
    <footer class="footer-section">
        <div class="footer-content">
            <div class="footer-logo-area">
                <img src="assests/images/LOGO.png" alt="FoodFix25 Logo" class="footer-logo">

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
   <script src="assests/js/script.js" defer></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.addEventListener('click', function() {
            const location = document.getElementById('location').value;
            const city = document.getElementById('city').value;
            const deliveryTime = document.getElementById('deliveryTime').value;
            const amPm = document.getElementById('amPm').value;

            if (location && city && deliveryTime && amPm) {
                alert(`Order details:\nLocation: ${location}\nCity: ${city}\nDelivery Time: ${deliveryTime} ${amPm}\n\nThank you for your order!`);
                // Here you would typically send this data to a backend server
                // or store it locally for further processing (e.g., redirect to a confirmation page).
            } else {
                alert('Please fill in all the details.');
            }
        });
    });
</script>
